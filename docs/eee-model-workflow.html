&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

        &#x27;The 59 units are USA + 9 Census divisions + 49 states represented in the input workbook.&#x27;
      ]
    },
    &#x27;evidence-target&#x27;: {
      heading:&#x27;Current artifact shape&#x27;,
      items:[
        &#x27;CSV: 26 rows × 13 columns = 25 state estimates plus one &lt;code&gt;POOLED&lt;/code&gt; estimate.&#x27;,
        &#x27;Columns carry sample counts, direct log-aPR and SE, empirical-Bayes pooled log-aPR and SE, aPR intervals, τ and I².&#x27;
      ]
    },
    &#x27;state-inputs&#x27;: {
      heading:&#x27;Current artifact shape&#x27;,
      items:[
        &#x27;&lt;code&gt;observed_draws&lt;/code&gt;: draw (500) × unit (59) × measure (8) × period (4).&#x27;,
        &#x27;&lt;code&gt;observed_point&lt;/code&gt;: unit (59) × measure (8) × period (4).&#x27;,
        &#x27;&lt;code&gt;covariance&lt;/code&gt;: measure (8) × measure (8). Also stores the 59 unit IDs/types, divisions, sample sizes, four years and 500 source draw IDs.&#x27;
      ]
    },
    &#x27;dynamic-fits&#x27;: {
      heading:&#x27;Current primary-fit shape&#x27;,
      items:[
        &#x27;One NPZ per specification; 34 fitted units = USA + 9 divisions + 24 selected states.&#x27;,
        &#x27;&lt;code&gt;J&lt;/code&gt;: draw (500) × unit (34) × target measure (8) × source measure (8).&#x27;,
        &#x27;&lt;code&gt;drift&lt;/code&gt; and &lt;code&gt;anchor_logits&lt;/code&gt;: 500 × 34 × 8; evidence slopes/aPRs: 500 × 34; success flags: 500 × 34.&#x27;
      ]
    },
    &#x27;epi-posterior&#x27;: {
      heading:&#x27;Current artifact shape&#x27;,
      items:[
        &#x27;&lt;code&gt;posterior.nc&lt;/code&gt;: chain (4) × draw (500) × state (48) for state-varying parameters, plus shared parameters.&#x27;,
        &#x27;&lt;code&gt;epi_bundle.npz&lt;/code&gt;: each parameter is sample (2,000) × state (48).&#x27;,
        &#x27;&lt;code&gt;cdc_raw&lt;/code&gt;: state (48) × indicator (6) × modeled year (20); native CDC values cover 8 years.&#x27;
      ]
    },
    &#x27;bundle&#x27;: {
      heading:&#x27;Current standardized-bundle shape&#x27;,
      items:[
        &#x27;Restricted to the 24 selected states shared by both fitted models.&#x27;,
        &#x27;&lt;code&gt;sem_J_samples&lt;/code&gt;: dynamic draw (500) × state (24) × target measure (8) × source measure (8).&#x27;,
        &#x27;&lt;code&gt;sem_drift_samples&lt;/code&gt;/&lt;code&gt;sem_anchor_logits&lt;/code&gt;: 500 × 24 × 8; &lt;code&gt;sem_obs_samples&lt;/code&gt;: 500 × 24 × 8 × 4.&#x27;,
        &#x27;Epidemic parameters: 2,000 × 24; &lt;code&gt;cdc_raw&lt;/code&gt;: 24 × 6 indicators × 20 annual years.&#x27;
      ]
    },
    &#x27;endpoints&#x27;: {
      heading:&#x27;Output-table shape&#x27;,
      items:[
        &#x27;Dynamic summary rows = state (24) × scenario × report year × dynamic measure (8).&#x27;,
        &#x27;Epidemic summary rows = state (24) × scenario × report year × epidemic endpoint (5); the current 5-scenario × 6-year run gives 3,600 rows.&#x27;,
        &#x27;Each summary has 17 columns: identifiers plus 2.5th/50th/97.5th percentiles for baseline, scenario, difference and percent change.&#x27;,
        &#x27;Optional draw tables add draw (500): one row per state × scenario × year × draw × variable.&#x27;
      ]
    },
    &#x27;research-bundle&#x27;: {
      heading:&#x27;What it does&#x27;,
      items:[
        &#x27;Aligns the epidemic bundle, dynamic fit and observed state inputs to the same fitted-state order.&#x27;,
        &#x27;Writes the standardized research NPZ and a provenance manifest.&#x27;
      ]
    },
    &#x27;build-bundle&#x27;: {
      heading:&#x27;Entry point&#x27;,
      items:[
        &#x27;Selects the epidemic bundle, dynamic-fit NPZ and state-input NPZ to combine.&#x27;,
        &#x27;Calls &lt;code&gt;artifacts/research_bundle.py&lt;/code&gt; and prints the resulting provenance manifest.&#x27;
      ]
    },
    &#x27;runtime&#x27;: {
      heading:&#x27;What it does&#x27;,
      items:[
        &#x27;Opens the standardized bundle and exposes consistent dynamic and epidemic sample loaders.&#x27;,
        &#x27;Reconstructs the state units used by the scenario runner.&#x27;
      ]
    },
    &#x27;scenarios&#x27;: {
      heading:&#x27;What it does&#x27;,
      items:[
        &#x27;Experiment-level runner: loads the bundle and runs one shared baseline.&#x27;,
        &#x27;Loops over requested scenario codes and report years, calls &lt;code&gt;projection.py&lt;/code&gt;, delegates comparisons to &lt;code&gt;scenario_results.py&lt;/code&gt;, then writes the tables.&#x27;
      ]
    },
    &#x27;run-scenarios&#x27;: {
      heading:&#x27;Entry point&#x27;,
      items:[
        &#x27;Turns command-line choices into a &lt;code&gt;ScenarioRunConfig&lt;/code&gt;.&#x27;,
        &#x27;Calls &lt;code&gt;run_scenarios()&lt;/code&gt;; it contains no projection equations or endpoint calculations.&#x27;
      ]
    },
    &#x27;projection&#x27;: {
      heading:&#x27;What it does&#x27;,
      items:[
        &#x27;Runs one intervention specification across requested states and Monte Carlo samples.&#x27;,
        &#x27;Pairs a dynamic-model draw with an epidemic-posterior draw, projects the prevention system, builds epidemic inputs and returns raw &lt;code&gt;ProjectionOutput&lt;/code&gt; trajectories.&#x27;
      ]
    },
    &#x27;dynamic-predictor&#x27;: {
      heading:&#x27;What it does&#x27;,
      items:[
        &#x27;Propagates the centered-logit system with &lt;code&gt;X[t+1] = J X[t] + drift&lt;/code&gt;.&#x27;,
        &#x27;Keeps observed periods fixed, applies measure interventions and converts projected logits back to probabilities.&#x27;

    },
    &#x27;epi-adapter&#x27;: {
      heading:&#x27;What it does&#x27;,
      items:[
        &#x27;Converts two-year dynamic trajectories into annual HIV-model inputs.&#x27;,
        &#x27;Combines projected testing, PrEP and risk behavior with CDC eligibility and viral-suppression stocks.&#x27;
      ]
    },
    &#x27;epi-predictor&#x27;: {
      heading:&#x27;What it does&#x27;,
      items:[
        &#x27;Applies one epidemic parameter draw to one state’s annual inputs.&#x27;,
        &#x27;Returns incidence, diagnoses, undiagnosed prevalence and PrEP counts over time.&#x27;
      ]
    },
    &#x27;projection-results&#x27;: {
      heading:&#x27;What it does&#x27;,
      items:[
        &#x27;Takes paired baseline and scenario &lt;code&gt;ProjectionOutput&lt;/code&gt; objects.&#x27;,
        &#x27;Extracts requested years, constructs cumulative incidence, and produces paired differences, intervals and optional draw-level rows.&#x27;

    &#x27;dynamic-fit-module&#x27;: {
      heading:&#x27;Runner responsibility&#x27;,
      items:[
        &#x27;For each model specification and each of 500 input draws, assembles the evidence target and calls the hierarchical fit.&#x27;,
        &#x27;Collects fitted matrices, drifts, anchors and diagnostics, then writes one fit NPZ per specification.&#x27;
      ]
    },
    &#x27;hierarchy&#x27;: {
      heading:&#x27;What it does&#x27;,
      items:[
        &#x27;Fits one draw in parent-first order: USA → Census divisions → selected states.&#x27;,
        &#x27;The national &lt;code&gt;J&lt;/code&gt; becomes each division’s shrinkage reference; each fitted division &lt;code&gt;J&lt;/code&gt; becomes its states’ reference.&#x27;
      ]
    },
    &#x27;epi-fit-module&#x27;: {
      heading:&#x27;Runner responsibility&#x27;,
      items:[
        &#x27;Builds aligned AMIS and CDC arrays, defines the hierarchical PyMC model and samples the posterior.&#x27;,
        &#x27;Writes &lt;code&gt;posterior.nc&lt;/code&gt;, calibration summaries and &lt;code&gt;epi_bundle.npz&lt;/code&gt;.&#x27;
      ]
    },
    &#x27;intervention-config&#x27;: {
      heading:&#x27;What it defines&#x27;,
      items:[
        &#x27;&lt;code&gt;INTERVENTION_CODEBOOK&lt;/code&gt;: five measure-level changes—three halving targets, holding AHS at 2024, and moving AHS to its benchmark.&#x27;,
        &#x27;&lt;code&gt;SCENARIO_CODEBOOK&lt;/code&gt;: five policy scenarios that combine those changes; four are designated for the paper and one for the supplement.&#x27;,
        &#x27;This file declares codes, targets and labels only; it does not run a projection.&#x27;
      ]
    },
    &#x27;projection-config&#x27;: {
      heading:&#x27;Current run settings&#x27;,
      items:[
        &#x27;500 paired dynamic/epidemic samples with seed 123; projections end in 2036.&#x27;,
        &#x27;Interventions ramp over three two-year steps (six years); cumulative infections begin in 2025.&#x27;,
        &#x27;Report years are every two-year step 2026-2036. Scenario PrEP uses the respondent-level prevalence ratio by default; the contextual upper bound (ratios 0.80 and 0.70) is requested per run.&#x27;
      ]
    },
    &#x27;intervention-build&#x27;: {
      heading:&#x27;What it does&#x27;,
      items:[
        &#x27;Converts intervention codes into &lt;code&gt;MeasureIntervention&lt;/code&gt; objects for one state’s dynamic-year grid.&#x27;,
        &#x27;Starts after the last observed period, ramps toward the target, and then holds the change.&#x27;,
        &#x27;At each step it changes the selected probability and returns it to the model’s centered-logit coordinates.&#x27;
      ]
    },
    &#x27;prep-translation&#x27;: {
      heading:&#x27;What it does&#x27;,
      items:[
        &#x27;&lt;code&gt;prevalence_ratio_translation&lt;/code&gt;: primary AHS→PrEP translation using the draw-specific respondent-level ratio.&#x27;,
        &#x27;&lt;code&gt;contextual_translation&lt;/code&gt;: upper-bound translation using the between-state climate ratio.&#x27;,
        &#x27;&lt;code&gt;retain_prep_fraction&lt;/code&gt;: resilient-delivery comparison that retains part of the PrEP gain while returning every other measure to baseline.&#x27;
      ]
    }
  };

  const nodeRoles = {
    &#x27;build-inputs&#x27;:&#x27;entry + builder&#x27;,
    &#x27;fit-dynamic&#x27;:&#x27;entry point&#x27;,
    &#x27;fit-epi&#x27;:&#x27;entry point&#x27;,
    &#x27;build-bundle&#x27;:&#x27;entry point&#x27;,
    &#x27;run-scenarios&#x27;:&#x27;entry point&#x27;,
    &#x27;dynamic-fit-module&#x27;:&#x27;runner&#x27;,
    &#x27;epi-fit-module&#x27;:&#x27;runner&#x27;,
    &#x27;scenarios&#x27;:&#x27;runner&#x27;,
    &#x27;projection&#x27;:&#x27;engine&#x27;,
    &#x27;dynamic-predictor&#x27;:&#x27;model component&#x27;,
    &#x27;epi-adapter&#x27;:&#x27;adapter&#x27;,
    &#x27;epi-predictor&#x27;:&#x27;model component&#x27;,
    &#x27;projection-results&#x27;:&#x27;summarizer&#x27;,
    &#x27;intervention-config&#x27;:&#x27;codebook&#x27;,
    &#x27;projection-config&#x27;:&#x27;settings&#x27;,
    &#x27;intervention-build&#x27;:&#x27;builder&#x27;,
    &#x27;prep-translation&#x27;:&#x27;translation functions&#x27;
  };

  Object.entries(nodeRoles).forEach(([nodeId, role]) =&gt; {
    const node = document.getElementById(nodeId);
    if (!node) return;
    const badge = document.createElement(&#x27;span&#x27;);
    badge.className = &#x27;eee-role-badge&#x27;;
    badge.textContent = role;
    node.appendChild(badge);
  });

  function toggleNodeDetail(node) {
    const opening = node.dataset.detailOpen !== &#x27;true&#x27;;
    node.dataset.detailOpen = String(opening);
    node.setAttribute(&#x27;aria-expanded&#x27;, String(opening));
    const hint = node.querySelector(&#x27;.eee-detail-hint&#x27;);
    if (hint) hint.textContent = opening ? &#x27;hide details ▴&#x27; : &#x27;details ▾&#x27;;
    requestAnimationFrame(draw);
  }

  Object.entries(nodeDetails).forEach(([nodeId, detail]) =&gt; {
    const node = document.getElementById(nodeId);
    if (!node) return;
    node.classList.add(&#x27;eee-expandable&#x27;);
    node.dataset.detailOpen = &#x27;false&#x27;;
    node.tabIndex = 0;
    node.setAttribute(&#x27;role&#x27;, &#x27;button&#x27;);
    node.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
    node.setAttribute(&#x27;aria-label&#x27;, `${node.firstChild?.textContent?.trim() || nodeId}; expand details`);

    const hint = document.createElement(&#x27;span&#x27;);
    hint.className = &#x27;eee-detail-hint&#x27;;
    hint.textContent = &#x27;details ▾&#x27;;
    node.appendChild(hint);

    const panel = document.createElement(&#x27;div&#x27;);
    panel.className = &#x27;eee-node-detail&#x27;;
    panel.innerHTML = `&lt;strong&gt;${detail.heading}&lt;/strong&gt;&lt;ul&gt;${detail.items.map(item =&gt; `&lt;li&gt;${item}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;`;
    node.appendChild(panel);

    node.addEventListener(&#x27;click&#x27;, event =&gt; {
      event.stopPropagation();
      toggleNodeDetail(node);
    });
    node.addEventListener(&#x27;keydown&#x27;, event =&gt; {
      if (event.key !== &#x27;Enter&#x27; &amp;&amp; event.key !== &#x27; &#x27;) return;
      event.preventDefault();
      toggleNodeDetail(node);
    });
  });

  function targetFor(id) {
    const el = document.getElementById(id);
    const group = root.querySelector(`[data-group=&quot;${nodeGroup[id]}&quot;]`);
    if (!el || !group) return null;
    return group.dataset.collapsed === &#x27;true&#x27; ? group.querySelector(&#x27;.eee-cluster-head&#x27;) : el;
  }

  function point(el, side, bounds) {
    const r = el.getBoundingClientRect();
    if (side === &#x27;right&#x27;) return { x:r.right - bounds.left, y:r.top + r.height / 2 - bounds.top };
    if (side === &#x27;left&#x27;) return { x:r.left - bounds.left, y:r.top + r.height / 2 - bounds.top };
    if (side === &#x27;bottom&#x27;) return { x:r.left + r.width / 2 - bounds.left, y:r.bottom - bounds.top };
    return { x:r.left + r.width / 2 - bounds.left, y:r.top - bounds.top };
  }

  function localRect(el, bounds) {
    const r = el.getBoundingClientRect();
    return { left:r.left-bounds.left, right:r.right-bounds.left, top:r.top-bounds.top,
      bottom:r.bottom-bounds.top, width:r.width, height:r.height,
      cx:r.left+r.width/2-bounds.left, cy:r.top+r.height/2-bounds.top };
  }

  function hasVerticalObstacle(aEl, bEl, x, bounds) {
    const a = localRect(aEl,bounds), b = localRect(bEl,bounds);
    const upper = Math.min(a.bottom,b.bottom), lower = Math.max(a.top,b.top);
    return [...root.querySelectorAll(&#x27;.eee-node, .eee-cluster-head&#x27;)].some(el =&gt; {
      if (el === aEl || el === bEl || el.getClientRects().length === 0) return false;
      const r = localRect(el,bounds);
      return r.top &lt; lower &amp;&amp; r.bottom &gt; upper &amp;&amp; x &gt;= r.left-3 &amp;&amp; x &lt;= r.right+3;
    });
  }

  function route(aEl, bEl, bounds, lane) {
    const ar = localRect(aEl,bounds), br = localRect(bEl,bounds);
    const clamp = (value, low, high) =&gt; Math.max(low,Math.min(high,value));
    const overlapX = Math.min(ar.right,br.right) - Math.max(ar.left,br.left);
    const vertical = br.top &gt;= ar.bottom || ar.top &gt;= br.bottom;
    const sameColumn = overlapX &gt; Math.min(ar.width,br.width) * .35;

    if (vertical &amp;&amp; sameColumn) {
      const centreX = (ar.cx + br.cx) / 2;
      const blocked = hasVerticalObstacle(aEl,bEl,centreX,bounds);
      if (!blocked) {
        const down = br.cy &gt;= ar.cy;
        const a = { x:clamp(br.cx,ar.left+10,ar.right-10), y:down ? ar.bottom : ar.top };
        const b = { x:clamp(a.x,br.left+10,br.right-10), y:down ? br.top : br.bottom };
        const mid = (a.y+b.y)/2 + ((lane%3)-1)*2;
        return { d:`M${a.x},${a.y} V${mid} H${b.x} V${b.y}`, lx:(a.x+b.x)/2, ly:mid-4 };
      }

      let side = &#x27;left&#x27;;
      let gutter = Math.min(ar.left,br.left) - 10 - (lane%5)*5;
      if (gutter &lt; 3) {
        side = &#x27;right&#x27;;
        gutter = Math.max(ar.right,br.right) + 10 + (lane%5)*5;
      }
      const a = point(aEl,side,bounds), b = point(bEl,side,bounds);
      return { d:`M${a.x},${a.y} H${gutter} V${b.y} H${b.x}`, lx:gutter, ly:(a.y+b.y)/2-4 };
    }

    const rightward = br.cx &gt;= ar.cx;
    const a = point(aEl,rightward ? &#x27;right&#x27; : &#x27;left&#x27;,bounds);
    const b = point(bEl,rightward ? &#x27;left&#x27; : &#x27;right&#x27;,bounds);
    const mid = (a.x+b.x)/2 + ((lane%7)-3)*3;
    return { d:`M${a.x},${a.y} H${mid} V${b.y} H${b.x}`, lx:mid, ly:(a.y+b.y)/2-4 };
  }

  function clearHighlight() {
    root.querySelectorAll(&#x27;.is-highlighted&#x27;).forEach(el =&gt; el.classList.remove(&#x27;is-highlighted&#x27;));
  }

  function highlightEdge(edgeIndex) {
    clearHighlight();
    const [from,to] = edges[edgeIndex];
    svg.querySelector(`.eee-edge[data-edge-index=&quot;${edgeIndex}&quot;]`)?.classList.add(&#x27;is-highlighted&#x27;);
    targetFor(from)?.classList.add(&#x27;is-highlighted&#x27;);
    targetFor(to)?.classList.add(&#x27;is-highlighted&#x27;);
  }

  function highlightNode(nodeId) {
    clearHighlight();
    document.getElementById(nodeId)?.classList.add(&#x27;is-highlighted&#x27;);
    edges.forEach(([from,to], edgeIndex) =&gt; {
      if (from !== nodeId &amp;&amp; to !== nodeId) return;
      svg.querySelector(`.eee-edge[data-edge-index=&quot;${edgeIndex}&quot;]`)?.classList.add(&#x27;is-highlighted&#x27;);
      targetFor(from)?.classList.add(&#x27;is-highlighted&#x27;);
      targetFor(to)?.classList.add(&#x27;is-highlighted&#x27;);
    });
  }

  function highlightGroup(groupName) {
    clearHighlight();
    root.querySelector(`[data-group=&quot;${groupName}&quot;] .eee-cluster-head`)?.classList.add(&#x27;is-highlighted&#x27;);
    edges.forEach(([from,to], edgeIndex) =&gt; {
      if (nodeGroup[from] !== groupName &amp;&amp; nodeGroup[to] !== groupName) return;
      svg.querySelector(`.eee-edge[data-edge-index=&quot;${edgeIndex}&quot;]`)?.classList.add(&#x27;is-highlighted&#x27;);
      targetFor(from)?.classList.add(&#x27;is-highlighted&#x27;);
      targetFor(to)?.classList.add(&#x27;is-highlighted&#x27;);
    });
  }

  function draw() {
    const bounds = canvas.getBoundingClientRect();
    svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${bounds.width} ${bounds.height}`);
    svg.innerHTML = `&lt;defs&gt;&lt;marker id=&quot;eee-arrow&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; refX=&quot;6&quot; refY=&quot;3.5&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L7,3.5 L0,7 Z&quot; fill=&quot;currentColor&quot;&gt;&lt;/path&gt;&lt;/marker&gt;&lt;/defs&gt;`;
    edges.forEach(([from,to,label,type], edgeIndex) =&gt; {
      const aEl = targetFor(from), bEl = targetFor(to);
      if (!aEl || !bEl || aEl === bEl) return;
      const {d,lx,ly} = route(aEl,bEl,bounds,edgeIndex);
      const hit = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;path&#x27;);
      hit.setAttribute(&#x27;d&#x27;,d); hit.setAttribute(&#x27;class&#x27;,&#x27;eee-edge-hit&#x27;); hit.dataset.edgeIndex=String(edgeIndex);
      hit.addEventListener(&#x27;pointerenter&#x27;,() =&gt; highlightEdge(edgeIndex));
      hit.addEventListener(&#x27;pointerleave&#x27;,clearHighlight);
      svg.appendChild(hit);
      const path = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;path&#x27;);
      path.setAttribute(&#x27;d&#x27;,d); path.setAttribute(&#x27;class&#x27;,`eee-edge ${type || &#x27;&#x27;}`); path.dataset.edgeIndex=String(edgeIndex);
      if (label) {
        const title = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;title&#x27;);
        title.textContent = label;
        path.appendChild(title);
      }
      svg.appendChild(path);
    });
  }

  root.querySelectorAll(&#x27;.eee-cluster-head&#x27;).forEach(button =&gt; {
    const groupName = button.closest(&#x27;.eee-cluster&#x27;).dataset.group;
    button.addEventListener(&#x27;pointerenter&#x27;,() =&gt; highlightGroup(groupName));
    button.addEventListener(&#x27;pointerleave&#x27;,clearHighlight);
    button.addEventListener(&#x27;focus&#x27;,() =&gt; highlightGroup(groupName));
    button.addEventListener(&#x27;blur&#x27;,clearHighlight);
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      const group = button.closest(&#x27;.eee-cluster&#x27;);
      const collapsed = group.dataset.collapsed !== &#x27;true&#x27;;
      group.dataset.collapsed = String(collapsed);
      button.setAttribute(&#x27;aria-expanded&#x27;, String(!collapsed));
      button.querySelector(&#x27;.eee-toggle&#x27;).textContent = collapsed ? &#x27;+&#x27; : &#x27;−&#x27;;
      requestAnimationFrame(draw);
    });
  });
  root.querySelectorAll(&#x27;.eee-node&#x27;).forEach(node =&gt; {
    node.addEventListener(&#x27;pointerenter&#x27;,() =&gt; highlightNode(node.id));
    node.addEventListener(&#x27;pointerleave&#x27;,clearHighlight);
    node.addEventListener(&#x27;focus&#x27;,() =&gt; highlightNode(node.id));
    node.addEventListener(&#x27;blur&#x27;,clearHighlight);
  });
  new ResizeObserver(draw).observe(canvas);
  requestAnimationFrame(draw);
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${

    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
